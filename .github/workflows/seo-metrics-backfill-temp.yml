name: One-off SEO Metrics Backfill (Feb-Jul 2026)

# Temporary, manually-dispatched workflow to backfill the Feb-Jul 2026 gap
# left by the collection workflow before it started committing to main
# (see issue #106). Uses fetch_seo_metrics.py's existing fetch_for_month
# backfill machinery (the same function --backfill drives per month), but
# targets the exact missing calendar months explicitly instead of the
# --backfill CLI's "last N complete months relative to today" shortcut,
# since today (2026-07-29) falls inside the last target month (July) and
# no relative offset can reach an in-progress current month.
#
# Deleted after the one-time backfill run completes; not part of the
# recurring pipeline.

on:
  workflow_dispatch:

jobs:
  backfill:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r ./seo-metrics/requirements.txt

      - name: Create credentials file
        run: echo '${{ secrets.GSC_CREDENTIALS_JSON }}' > gsc-credentials.json

      - name: Run backfill for Feb-Jul 2026
        env:
          GSC_CREDENTIALS_PATH: ${{ github.workspace }}/gsc-credentials.json
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          BING_API_KEY: ${{ secrets.BING_API_KEY }}
          BING_SITE_URL: ${{ secrets.BING_SITE_URL }}
          UMAMI_API_KEY: ${{ secrets.UMAMI_API_KEY }}
          UMAMI_WEBSITE_ID: ${{ secrets.UMAMI_WEBSITE_ID }}
          OUTPUT_DIR: ${{ github.workspace }}/seo-metrics
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "seo-metrics")
          from fetch_seo_metrics import fetch_for_month, verify_month_output
          from pathlib import Path

          targets = [(2026, 2), (2026, 3), (2026, 4), (2026, 5), (2026, 6), (2026, 7)]
          summary = []
          for year, month in targets:
              fetch_for_month(year, month)
              month_dir = Path("seo-metrics") / f"{year:04d}-{month:02d}"
              missing = verify_month_output(month_dir)
              landed = [f for f in ("google-search-console.json", "bing-webmaster.json", "umami-analytics.json") if f not in missing]
              summary.append((f"{year:04d}-{month:02d}", landed, missing))

          print("\n===== Backfill summary =====")
          for month, landed, missing in summary:
              print(f"{month}: landed={landed or '[]'} missing_or_empty={missing or '[]'}")
          print("=============================\n")
          PY

      - name: Upload SEO metrics artifact
        uses: actions/upload-artifact@v4
        with:
          name: seo-metrics-backfill-logs
          path: seo-metrics/
          retention-days: 90

      - name: Commit and push backfilled months
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seo-metrics/2026-02 seo-metrics/2026-03 seo-metrics/2026-04 seo-metrics/2026-05 seo-metrics/2026-06 seo-metrics/2026-07
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "seo-metrics: backfill Feb-Jul 2026 data (#106)"
            git push
          fi

      - name: Notify Discord on backfill failure
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.SEO_DISCORD_WEBHOOK }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "SEO_DISCORD_WEBHOOK secret not configured, skipping notification"
            exit 0
          fi
          PAYLOAD=$(jq -n --arg content "🚨 **SEO metrics backfill (Feb-Jul 2026) failed**
          Repo: ${REPO}
          ${RUN_URL}" '{content: $content}')
          curl -sf -X POST "$DISCORD_WEBHOOK" -H 'Content-Type: application/json' -d "$PAYLOAD"
